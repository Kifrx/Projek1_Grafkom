<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rekonstruksi Gambar - Anak Bermain Bola</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #f0f0f0;
        color: #333;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
      }

      .container {
        display: flex;
        gap: 20px;
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }

      .canvas-section {
        position: relative;
      }

      canvas {
        border: 2px solid #ccc;
        border-radius: 4px;
        background-color: #ffffff; /* Langit putih sesuai gambar asli */
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>WebGL: Anak Bermain Bola & Anjing</h1>

    <div class="container">
      <div class="canvas-section">
        <canvas id="glCanvas" width="800" height="550"></canvas>
      </div>
    </div>

    <!-- Modul utama -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
